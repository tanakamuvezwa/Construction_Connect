<body class="admin-body">

<div class="afri-border"></div>

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <div class="admin-brand-icon">⚡</div>
      <div>
        <h2>Zimbo Admin</h2>
        <small>Construction Connect</small>
      </div>
    </div>

    <nav class="admin-nav">
      <button class="admin-nav-item active" data-tab="tab-overview" onclick="switchAdminTab('tab-overview', this)">
        <span>📊</span> Dashboard Overview
      </button>
      <button class="admin-nav-item" data-tab="tab-mfrs" onclick="switchAdminTab('tab-mfrs', this)">
        <span>🏭</span> Manufacturers <span class="admin-nav-badge" id="badgeMfrCount">6</span>
      </button>
      <button class="admin-nav-item" data-tab="tab-products" onclick="switchAdminTab('tab-products', this)">
        <span>📦</span> Product Catalog <span class="admin-nav-badge" id="badgeProdCount">14</span>
      </button>
      <button class="admin-nav-item" data-tab="tab-orders" onclick="switchAdminTab('tab-orders', this)">
        <span>📋</span> Orders & RFQs <span class="admin-nav-badge" id="badgeOrderCount">2</span>
      </button>
      <button class="admin-nav-item" data-tab="tab-designs" onclick="switchAdminTab('tab-designs', this)">
        <span>🎨</span> Custom Designs & Bids <span class="admin-nav-badge" id="badgeDesignCount">3</span>
      </button>
      <button class="admin-nav-item" data-tab="tab-formspree" onclick="switchAdminTab('tab-formspree', this)">
        <span>✉️</span> Formspree Submissions <span class="admin-nav-badge" id="badgeSubCount">0</span>
      </button>
      <button class="admin-nav-item" data-tab="tab-settings" onclick="switchAdminTab('tab-settings', this)">
        <span>⚙️</span> Platform Settings
      </button>
    </nav>

    <div class="admin-user-box">
      <div class="admin-user-info">
        <div class="admin-avatar">TM</div>
        <div class="admin-user-details">
          <strong>Tanaka Muvezwa</strong>
          <span>Super Administrator</span>
        </div>
      </div>
      <a href="index.html" title="Exit to marketplace" style="color: #94A3B8; font-size: 18px; text-decoration: none;">🚪</a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <h1 id="topbarTitle">Dashboard Overview</h1>
        <small style="color: var(--admin-muted);">Construction Connect • Zimbabwe B2B Manufacturing Engine</small>
      </div>
      <div class="admin-topbar-actions">
        <a href="index.html" class="btn-admin btn-admin-outline" target="_blank">🌐 Live Marketplace ↗</a>
        <button class="btn-admin btn-admin-primary" onclick="openNewProductModal()">+ Add Product</button>
      </div>
    </header>

    <div class="admin-content" id="adminContentContainer">
      <!-- Dynamic View Injected via admin.js -->
    </div>
  </main>
</div>

<!-- Modal Dialog Container -->
<div class="modal-overlay" id="adminModal">
  <div class="modal modal-lg" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="adminModalTitle">Modal Title</h2>
      <button class="modal-close" onclick="closeAdminModal()">✕</button>
    </div>
    <div class="modal-body" id="adminModalBody"></div>
  </div>
</div>

<div id="toastContainer"></div>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/formspree.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
